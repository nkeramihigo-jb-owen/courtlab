<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>CourtLab — Basketball Play Simulator</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: #111827;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        padding: 30px;
    }

    .app {
        width: min(1200px, 100%);
        margin: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .brand h1 {
        font-size: 30px;
        margin-bottom: 5px;
    }

    .brand p {
        color: #9ca3af;
        font-size: 14px;
    }

    .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 11px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        background: #374151;
        color: white;
    }

    button:hover {
        background: #4b5563;
    }

    button.active {
        background: #2563eb;
    }

    .court-wrapper {
        width: 100%;
        background: #1f2937;
        padding: 15px;
        border-radius: 16px;
    }

    .court {
        position: relative;
        width: 100%;
        aspect-ratio: 94 / 50;
        background: #d89a55;
        border: 4px solid white;
        overflow: hidden;
        user-select: none;
        touch-action: none;
    }

    /*
    ==========================================
    BASIC COURT MARKINGS
    ==========================================
    */

    .half-court-line {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 3px;
        background: white;
        transform: translateX(-50%);
    }

    .center-circle {
        position: absolute;
        width: 18%;
        aspect-ratio: 1;
        border: 3px solid white;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    .center-dot {
        position: absolute;
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    /*
    ==========================================
    PAINT
    ==========================================
    */

    .paint-left,
    .paint-right {
        position: absolute;
        width: 18%;
        height: 40%;
        top: 30%;
        border: 3px solid white;
    }

    .paint-left {
        left: 0;
    }

    .paint-right {
        right: 0;
    }

    /*
    ==========================================
    FREE THROW CIRCLES
    ==========================================
    */

    .free-circle-left,
    .free-circle-right {
        position: absolute;
        width: 14%;
        aspect-ratio: 1;
        border: 3px solid white;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
    }

    .free-circle-left {
        left: 11%;
    }

    .free-circle-right {
        right: 11%;
    }

    /*
    ==========================================
    THREE POINT LINES
    ==========================================
    */

    .three-point-left,
    .three-point-right {
        position: absolute;

        width: 42%;
        height: 88%;

        top: 6%;

        border: 3px solid white;

        border-radius: 50%;
    }

    .three-point-left {
        left: -21%;
    }

    .three-point-right {
        right: -21%;
    }

    /*
    ==========================================
    BASKETS
    ==========================================
    */

    .basket-left,
    .basket-right {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 4px solid #ef4444;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
    }

    .basket-left {
        left: 1%;
    }

    .basket-right {
        right: 1%;
    }

    /*
    ==========================================
    HALF COURT MODE
    ==========================================
    */

    .court.half-court {
        aspect-ratio: 47 / 50;
    }

    .court.half-court .half-court-line,
    .court.half-court .center-circle,
    .court.half-court .center-dot,
    .court.half-court .paint-right,
    .court.half-court .free-circle-right,
    .court.half-court .three-point-right,
    .court.half-court .basket-right {
        display: none;
    }

    .court.half-court .paint-left {
        width: 36%;
    }

    .court.half-court .free-circle-left {
        left: 22%;
    }

    /*
    ==========================================
    HALF COURT THREE POINT LINE
    ==========================================
    */

    .court.half-court .three-point-left {
        width: 84%;
        height: 88%;
        left: -42%;
    }

    /*
    ==========================================
    PLAYERS
    ==========================================
    */

    .player {
        position: absolute;

        width: 44px;
        height: 44px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 13px;
        font-weight: bold;

        cursor: grab;

        z-index: 10;

        transform: translate(-50%, -50%);

        border: 3px solid white;

        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .player:active {
        cursor: grabbing;
    }

    .offense {
        background: #16a34a;
    }

    .defense {
        background: #dc2626;
    }

    .player.selected {
        box-shadow:
            0 0 0 4px rgba(255, 255, 255, 0.5),
            0 6px 15px rgba(0, 0, 0, 0.4);
    }

    /*
    ==========================================
    BALL
    ==========================================
    */

    .ball {
        position: absolute;

        width: 25px;
        height: 25px;

        border-radius: 50%;

        background: #f97316;

        border: 2px solid #7c2d12;

        z-index: 20;

        cursor: grab;

        transform: translate(-50%, -50%);
    }

    /*
    ==========================================
    INFO
    ==========================================
    */

    .info-panel {
        margin-top: 15px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        flex-wrap: wrap;
        gap: 15px;

        background: #1f2937;

        padding: 15px;

        border-radius: 12px;
    }

    .legend {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px;

        font-size: 14px;
        color: #d1d5db;
    }

    .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
    }

    .green {
        background: #16a34a;
    }

    .red {
        background: #dc2626;
    }

    .orange {
        background: #f97316;
    }

    .status {
        color: #9ca3af;
        font-size: 14px;
    }

    @media (max-width: 700px) {

        body {
            padding: 12px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
        }

        .player {
            width: 34px;
            height: 34px;
            font-size: 10px;
        }

        .ball {
            width: 20px;
            height: 20px;
        }

    }

</style>


</head>

<body>

<div class="app">


<div class="header">

    <div class="brand">

        <h1>🏀 CourtLab</h1>

        <p>
            Design. Move. Practice. Understand the game.
        </p>

    </div>


    <div class="controls">

        <button
            id="fullCourtBtn"
            class="active"
            type="button"
        >
            Full Court
        </button>

        <button
            id="halfCourtBtn"
            type="button"
        >
            Half Court
        </button>

        <button
            id="resetBtn"
            type="button"
        >
            Reset
        </button>

        <button
            id="playBtn"
            type="button"
        >
            ▶ Play
        </button>

    </div>

</div>


<div class="court-wrapper">

    <div
        class="court"
        id="court"
    >

        <!-- CENTER -->

        <div class="half-court-line"></div>

        <div class="center-circle"></div>

        <div class="center-dot"></div>


        <!-- PAINT -->

        <div class="paint-left"></div>

        <div class="paint-right"></div>


        <!-- FREE THROW -->

        <div class="free-circle-left"></div>

        <div class="free-circle-right"></div>


        <!-- THREE POINT -->

        <div class="three-point-left"></div>

        <div class="three-point-right"></div>


        <!-- BASKETS -->

        <div class="basket-left"></div>

        <div class="basket-right"></div>


        <!-- OFFENSE -->

        <div
            class="player offense"
            data-player="1"
            style="left:25%;top:50%;"
        >
            1
        </div>

        <div
            class="player offense"
            data-player="2"
            style="left:32%;top:25%;"
        >
            2
        </div>

        <div
            class="player offense"
            data-player="3"
            style="left:32%;top:75%;"
        >
            3
        </div>

        <div
            class="player offense"
            data-player="4"
            style="left:43%;top:35%;"
        >
            4
        </div>

        <div
            class="player offense"
            data-player="5"
            style="left:43%;top:65%;"
        >
            5
        </div>


        <!-- DEFENSE -->

        <div
            class="player defense"
            data-player="D1"
            style="left:31%;top:50%;"
        >
            D1
        </div>

        <div
            class="player defense"
            data-player="D2"
            style="left:39%;top:22%;"
        >
            D2
        </div>

        <div
            class="player defense"
            data-player="D3"
            style="left:39%;top:78%;"
        >
            D3
        </div>

        <div
            class="player defense"
            data-player="D4"
            style="left:51%;top:35%;"
        >
            D4
        </div>

        <div
            class="player defense"
            data-player="D5"
            style="left:51%;top:65%;"
        >
            D5
        </div>


        <!-- BALL -->

        <div
            class="ball"
            id="ball"
            style="left:25%;top:50%;"
        ></div>

    </div>

</div>


<div class="info-panel">

    <div class="legend">

        <div class="legend-item">
            <span class="legend-dot green"></span>
            Offense
        </div>

        <div class="legend-item">
            <span class="legend-dot red"></span>
            Defense
        </div>

        <div class="legend-item">
            <span class="legend-dot orange"></span>
            Ball
        </div>

    </div>


    <div
        class="status"
        id="status"
    >
        Full court — drag players or the ball.
    </div>

</div>


</div>

<script>

    const court =
        document.getElementById("court");

    const players =
        document.querySelectorAll(".player");

    const ball =
        document.getElementById("ball");

    const resetBtn =
        document.getElementById("resetBtn");

    const playBtn =
        document.getElementById("playBtn");

    const fullCourtBtn =
        document.getElementById("fullCourtBtn");

    const halfCourtBtn =
        document.getElementById("halfCourtBtn");

    const status =
        document.getElementById("status");


    let selectedObject = null;

    let isDragging = false;


    /*
    ==========================================
    COURT MODE
    ==========================================
    */

    function setCourtMode(mode) {

        if (mode === "half") {

            court.classList.add("half-court");

            halfCourtBtn.classList.add("active");

            fullCourtBtn.classList.remove("active");

            status.textContent =
                "Half court — drag players or the ball.";

        } else {

            court.classList.remove("half-court");

            fullCourtBtn.classList.add("active");

            halfCourtBtn.classList.remove("active");

            status.textContent =
                "Full court — drag players or the ball.";
        }

    }


    /*
    ==========================================
    BUTTONS
    ==========================================
    */

    fullCourtBtn.addEventListener(
        "click",
        () => setCourtMode("full")
    );


    halfCourtBtn.addEventListener(
        "click",
        () => setCourtMode("half")
    );


    /*
    ==========================================
    DRAGGING
    ==========================================
    */

    function startDragging(event) {

        selectedObject =
            event.currentTarget;

        isDragging = true;

        selectedObject.classList.add("selected");

        selectedObject.setPointerCapture(
            event.pointerId
        );

        const playerName =
            selectedObject.dataset.player || "Ball";

        status.textContent =
            "Moving " + playerName;

        event.preventDefault();
    }


    function moveObject(event) {

        if (
            !isDragging ||
            !selectedObject
        ) {
            return;
        }


        const courtRect =
            court.getBoundingClientRect();


        let x =
            ((event.clientX - courtRect.left)
            / courtRect.width) * 100;


        let y =
            ((event.clientY - courtRect.top)
            / courtRect.height) * 100;


        /*
        Keep objects inside the court.
        */

        x =
            Math.max(
                3,
                Math.min(97, x)
            );


        y =
            Math.max(
                5,
                Math.min(95, y)
            );


        selectedObject.style.left =
            x + "%";


        selectedObject.style.top =
            y + "%";

    }


    function stopDragging() {

        if (!selectedObject) {
            return;
        }


        isDragging = false;


        selectedObject.classList.remove(
            "selected"
        );


        status.textContent =
            "Position updated. Keep designing your play.";


        selectedObject = null;

    }


    /*
    ==========================================
    PLAYER EVENTS
    ==========================================
    */

    players.forEach(player => {

        player.addEventListener(
            "pointerdown",
            startDragging
        );

    });


    /*
    ==========================================
    BALL EVENT
    ==========================================
    */

    ball.addEventListener(
        "pointerdown",
        startDragging
    );


    /*
    ==========================================
    MOVEMENT
    ==========================================
    */

    court.addEventListener(
        "pointermove",
        moveObject
    );


    window.addEventListener(
        "pointerup",
        stopDragging
    );


    /*
    ==========================================
    RESET
    ==========================================
    */

    resetBtn.addEventListener(
        "click",
        () => {

            location.reload();

        }
    );


    /*
    ==========================================
    PLAYBACK
    ==========================================
    */

    playBtn.addEventListener(
        "click",
        () => {

            status.textContent =
                "Playback engine coming next 🏀";

        }
    );

</script>

</body>
</html>
