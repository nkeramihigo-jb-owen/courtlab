<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>CourtLab — Basketball Play Simulator</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: #111827;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        padding: 30px;
    }

    .app {
        width: min(1200px, 100%);
        margin: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .brand h1 {
        font-size: 30px;
        margin-bottom: 5px;
    }

    .brand p {
        color: #9ca3af;
        font-size: 14px;
    }

    .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 11px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        background: #374151;
        color: white;
    }

    button:hover {
        background: #4b5563;
    }

    button.active {
        background: #2563eb;
    }

    button.recording {
        background: #dc2626;
    }

    button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .court-wrapper {
        width: 100%;
        background: #1f2937;
        padding: 15px;
        border-radius: 16px;
    }

    .court {
        position: relative;
        width: 100%;
        aspect-ratio: 94 / 50;
        background: #d89a55;
        border: 4px solid white;
        overflow: hidden;
        user-select: none;
        touch-action: none;
    }

    /*
    ==========================================
    BASIC COURT MARKINGS
    ==========================================
    */

    .half-court-line {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 3px;
        background: white;
        transform: translateX(-50%);
    }

    .center-circle {
        position: absolute;
        width: 18%;
        aspect-ratio: 1;
        border: 3px solid white;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    .center-dot {
        position: absolute;
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    /*
    ==========================================
    PAINT
    ==========================================
    */

    .paint-left,
    .paint-right {
        position: absolute;
        width: 18%;
        height: 40%;
        top: 30%;
        border: 3px solid white;
    }

    .paint-left {
        left: 0;
    }

    .paint-right {
        right: 0;
    }

    /*
    ==========================================
    FREE THROW CIRCLES
    ==========================================
    */

    .free-circle-left,
    .free-circle-right {
        position: absolute;
        width: 14%;
        aspect-ratio: 1;
        border: 3px solid white;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
    }

    .free-circle-left {
        left: 11%;
    }

    .free-circle-right {
        right: 11%;
    }

    /*
    ==========================================
    THREE POINT LINES
    ==========================================
    */

    .three-point-left,
    .three-point-right {
        position: absolute;
        width: 42%;
        height: 88%;
        top: 6%;
        border: 3px solid white;
        border-radius: 50%;
    }

    .three-point-left {
        left: -21%;
    }

    .three-point-right {
        right: -21%;
    }

    /*
    ==========================================
    BASKETS
    ==========================================
    */

    .basket-left,
    .basket-right {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 4px solid #ef4444;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
    }

    .basket-left {
        left: 1%;
    }

    .basket-right {
        right: 1%;
    }

    /*
    ==========================================
    HALF COURT MODE
    ==========================================
    */

    .court.half-court {
        aspect-ratio: 47 / 50;
    }

    .court.half-court .half-court-line,
    .court.half-court .center-circle,
    .court.half-court .center-dot,
    .court.half-court .paint-right,
    .court.half-court .free-circle-right,
    .court.half-court .three-point-right,
    .court.half-court .basket-right {
        display: none;
    }

    .court.half-court .paint-left {
        width: 36%;
    }

    .court.half-court .free-circle-left {
        left: 22%;
    }

    .court.half-court .three-point-left {
        width: 84%;
        height: 88%;
        left: -42%;
    }

    /*
    ==========================================
    PLAYERS
    ==========================================
    */

    .player {
        position: absolute;

        width: 44px;
        height: 44px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 13px;
        font-weight: bold;

        cursor: grab;

        z-index: 10;

        transform: translate(-50%, -50%);

        border: 3px solid white;

        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .player:active {
        cursor: grabbing;
    }

    .offense {
        background: #16a34a;
    }

    .defense {
        background: #dc2626;
    }

    .player.selected {
        box-shadow:
            0 0 0 4px rgba(255, 255, 255, 0.5),
            0 6px 15px rgba(0, 0, 0, 0.4);
    }

    /*
    ==========================================
    BALL
    ==========================================
    */

    .ball {
        position: absolute;

        width: 25px;
        height: 25px;

        border-radius: 50%;

        background: #f97316;

        border: 2px solid #7c2d12;

        z-index: 20;

        cursor: grab;

        transform: translate(-50%, -50%);
    }

    .ball.selected {
        box-shadow:
            0 0 0 4px rgba(255, 255, 255, 0.5),
            0 5px 12px rgba(0, 0, 0, 0.4);
    }

    /*
    ==========================================
    INFO
    ==========================================
    */

    .info-panel {
        margin-top: 15px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        flex-wrap: wrap;
        gap: 15px;

        background: #1f2937;

        padding: 15px;

        border-radius: 12px;
    }

    .legend {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px;

        font-size: 14px;
        color: #d1d5db;
    }

    .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
    }

    .green {
        background: #16a34a;
    }

    .red {
        background: #dc2626;
    }

    .orange {
        background: #f97316;
    }

    .status {
        color: #9ca3af;
        font-size: 14px;
    }

    /*
    ==========================================
    RECORDING PANEL
    ==========================================
    */

    .recording-panel {
        margin-top: 15px;

        background: #1f2937;

        padding: 18px;

        border-radius: 12px;
    }

    .recording-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 15px;
    }

    .recording-title {
        font-size: 18px;
        font-weight: bold;
    }

    .recording-time {
        color: #9ca3af;
        font-size: 14px;
    }

    .recording-controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .timeline {
        background: #111827;
        border-radius: 8px;
        padding: 12px;
        max-height: 220px;
        overflow-y: auto;
    }

    .timeline-empty {
        color: #6b7280;
        font-size: 14px;
        text-align: center;
        padding: 15px;
    }

    .timeline-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;

        padding: 9px 10px;

        border-bottom: 1px solid #374151;

        color: #d1d5db;

        font-size: 13px;
    }

    .timeline-item:last-child {
        border-bottom: none;
    }

    .timeline-player {
        font-weight: bold;
        color: white;
    }

    .timeline-time {
        color: #60a5fa;
        min-width: 55px;
    }

    .timeline-action {
        color: #9ca3af;
        flex: 1;
    }

    .recording-indicator {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #fca5a5;
        font-size: 13px;
    }

    .recording-dot {
        width: 9px;
        height: 9px;
        background: #ef4444;
        border-radius: 50%;
        animation: recordingPulse 1s infinite;
    }

    @keyframes recordingPulse {
        0% {
            opacity: 1;
        }

        50% {
            opacity: 0.35;
        }

        100% {
            opacity: 1;
        }
    }

    .playback-progress {
        width: 100%;
        height: 5px;
        background: #374151;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 12px;
    }

    .playback-progress-bar {
        width: 0%;
        height: 100%;
        background: #2563eb;
        transition: width 0.05s linear;
    }

    /*
    ==========================================
    FOOTER
    ==========================================
    */

    .footer {
        text-align: center;
        color: #6b7280;
        font-size: 12px;
        margin-top: 25px;
    }

    @media (max-width: 700px) {

        body {
            padding: 12px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
        }

        .player {
            width: 34px;
            height: 34px;
            font-size: 10px;
        }

        .ball {
            width: 20px;
            height: 20px;
        }

        .timeline-item {
            align-items: flex-start;
        }
    }
</style>


</head>

<body>

<div class="app">


<div class="header">

    <div class="brand">

        <h1>🏀 CourtLab</h1>

        <p>
            Design. Move. Practice. Understand the game.
        </p>

    </div>

    <div class="controls">

        <button
            id="fullCourtBtn"
            class="active"
            type="button"
        >
            Full Court
        </button>

        <button
            id="halfCourtBtn"
            type="button"
        >
            Half Court
        </button>

        <button
            id="resetBtn"
            type="button"
        >
            Reset
        </button>

        <button
            id="playBtn"
            type="button"
            disabled
        >
            ▶ Play
        </button>

    </div>

</div>


<div class="court-wrapper">

    <div
        class="court"
        id="court"
    >

        <!-- CENTER -->

        <div class="half-court-line"></div>

        <div class="center-circle"></div>

        <div class="center-dot"></div>


        <!-- PAINT -->

        <div class="paint-left"></div>

        <div class="paint-right"></div>


        <!-- FREE THROW -->

        <div class="free-circle-left"></div>

        <div class="free-circle-right"></div>


        <!-- THREE POINT -->

        <div class="three-point-left"></div>

        <div class="three-point-right"></div>


        <!-- BASKETS -->

        <div class="basket-left"></div>

        <div class="basket-right"></div>


        <!-- OFFENSE -->

        <div
            class="player offense"
            data-player="1"
            style="left:25%;top:50%;"
        >
            1
        </div>

        <div
            class="player offense"
            data-player="2"
            style="left:32%;top:25%;"
        >
            2
        </div>

        <div
            class="player offense"
            data-player="3"
            style="left:32%;top:75%;"
        >
            3
        </div>

        <div
            class="player offense"
            data-player="4"
            style="left:43%;top:35%;"
        >
            4
        </div>

        <div
            class="player offense"
            data-player="5"
            style="left:43%;top:65%;"
        >
            5
        </div>


        <!-- DEFENSE -->

        <div
            class="player defense"
            data-player="D1"
            style="left:31%;top:50%;"
        >
            D1
        </div>

        <div
            class="player defense"
            data-player="D2"
            style="left:39%;top:22%;"
        >
            D2
        </div>

        <div
            class="player defense"
            data-player="D3"
            style="left:39%;top:78%;"
        >
            D3
        </div>

        <div
            class="player defense"
            data-player="D4"
            style="left:51%;top:35%;"
        >
            D4
        </div>

        <div
            class="player defense"
            data-player="D5"
            style="left:51%;top:65%;"
        >
            D5
        </div>


        <!-- BALL -->

        <div
            class="ball"
            id="ball"
            style="left:25%;top:50%;"
        ></div>

    </div>

</div>


<!-- INFO -->

<div class="info-panel">

    <div class="legend">

        <div class="legend-item">
            <span class="legend-dot green"></span>
            Offense
        </div>

        <div class="legend-item">
            <span class="legend-dot red"></span>
            Defense
        </div>

        <div class="legend-item">
            <span class="legend-dot orange"></span>
            Ball
        </div>

    </div>

    <div
        class="status"
        id="status"
    >
        Full court — drag players or the ball.
    </div>

</div>


<!-- RECORDING -->

<div class="recording-panel">

    <div class="recording-header">

        <div>

            <div class="recording-title">
                🎬 Play Recording
            </div>

            <div
                class="recording-time"
                id="recordingTime"
            >
                0.0s
            </div>

        </div>

        <div
            id="recordingIndicator"
            class="recording-indicator"
            style="display:none;"
        >
            <span class="recording-dot"></span>

        </div>

    </div>


    <div class="recording-controls">

        <button

</div>


<div class="footer">

</div>

<script>

    /*
    ==========================================
    COURT ELEMENTS
    ==========================================
    */

    const court =
        document.getElementById("court");

    const players =
        document.querySelectorAll(".player");

    const ball =
        document.getElementById("ball");

    const resetBtn =
        document.getElementById("resetBtn");

    const playBtn =
        document.getElementById("playBtn");

    const fullCourtBtn =
        document.getElementById("fullCourtBtn");

    const halfCourtBtn =
        document.getElementById("halfCourtBtn");

    const status =
        document.getElementById("status");

    const recordBtn =
        document.getElementById("recordBtn");

    const stopBtn =
        document.getElementById("stopBtn");

    const restartBtn =
        document.getElementById("restartBtn");

    const pauseBtn =
        document.getElementById("pauseBtn");

    const clearBtn =
        document.getElementById("clearBtn");

    const timeline =
        document.getElementById("timeline");

    const recordingTime =
        document.getElementById("recordingTime");

    const recordingIndicator =
        document.getElementById("recordingIndicator");

    const playbackProgress =
        document.getElementById("playbackProgress");


    /*
    ==========================================
    STATE
    ==========================================
    */

    let selectedObject = null;

    let isDragging = false;

    let isRecording = false;

    let isPlaying = false;

    let isPaused = false;

    let recordingStartTime = 0;

    let recordingTimer = null;

    let playbackFrame = null;

    let playbackStartTime = 0;

    let playbackPausedAt = 0;

    let recordedEvents = [];

    let initialPositions = {};

    let lastRecordedTime = 0;


    /*
    ==========================================
    OBJECT NAME
    ==========================================
    */

    function getObjectName(object) {

        if (object.classList.contains("ball")) {
            return "Ball";
        }

        return "Player " + object.dataset.player;

    }


    /*
    ==========================================
    GET POSITION
    ==========================================
    */

    function getPosition(object) {

        return {
            x: parseFloat(object.style.left),
            y: parseFloat(object.style.top)
        };

    }


    /*
    ==========================================
    SAVE INITIAL POSITIONS
    ==========================================
    */

    function saveInitialPositions() {

        initialPositions = {};

        const objects = [
            ...players,
            ball
        ];

        objects.forEach(object => {

            initialPositions[
                getObjectName(object)
            ] = getPosition(object);

        });

    }


    /*
    ==========================================
    RESTORE INITIAL POSITIONS
    ==========================================
    */

    function restoreInitialPositions() {

        const objects = [
            ...players,
            ball
        ];

        objects.forEach(object => {

            const name =
                getObjectName(object);

            const position =
                initialPositions[name];

            if (!position) {
                return;
            }

            object.style.left =
                position.x + "%";

            object.style.top =
                position.y + "%";

        });

    }


    /*
    ==========================================
    COURT MODE
    ==========================================
    */

    function setCourtMode(mode) {

        if (mode === "half") {

            court.classList.add("half-court");

            halfCourtBtn.classList.add("active");

            fullCourtBtn.classList.remove("active");

            status.textContent =
                "Half court — drag players or the ball.";

        } else {

            court.classList.remove("half-court");

            fullCourtBtn.classList.add("active");

            halfCourtBtn.classList.remove("active");

            status.textContent =
                "Full court — drag players or the ball.";

        }

    }


    fullCourtBtn.addEventListener(
        "click",
        () => setCourtMode("full")
    );


    halfCourtBtn.addEventListener(
        "click",
        () => setCourtMode("half")
    );


    /*
    ==========================================
    RECORDING TIMER
    ==========================================
    */

    function updateRecordingTimer() {

        if (!isRecording) {
            return;
        }

        const elapsed =
            (performance.now() - recordingStartTime) / 1000;

        recordingTime.textContent =
            elapsed.toFixed(1) + "s";

    }


    /*
    ==========================================
    START RECORDING
    ==========================================
    */

    function startRecording() {

        stopPlayback();

        recordedEvents = [];

        saveInitialPositions();

        recordingStartTime =
            performance.now();

        lastRecordedTime = 0;

        isRecording = true;

        recordingIndicator.style.display =
            "inline-flex";

        recordBtn.classList.add(
            "recording"
        );

        recordBtn.textContent =
            "🔴 Recording...";

        recordBtn.disabled = true;

        stopBtn.disabled = false;

        restartBtn.disabled = true;

        pauseBtn.disabled = true;

        clearBtn.disabled = false;

        playBtn.disabled = true;

        recordingTime.textContent =
            "0.0s";

        timeline.innerHTML = "";

        const startingEvent =
            document.createElement("div");

        startingEvent.className =
            "timeline-item";

        startingEvent.innerHTML = `
            <span class="timeline-time">0.0s</span>
            <span class="timeline-player">All</span>
            <span class="timeline-action">Starting positions saved</span>
        `;

        timeline.appendChild(
            startingEvent
        );

        recordingTimer =
            setInterval(
                updateRecordingTimer,
                50
            );

        status.textContent =
            "Recording started — move your players and ball.";

    }


    /*
    ==========================================
    STOP RECORDING
    ==========================================
    */

    function stopRecording() {

        if (!isRecording) {
            return;
        }

        isRecording = false;

        clearInterval(
            recordingTimer
        );

        recordingTimer = null;

        recordingIndicator.style.display =
            "none";

        recordBtn.classList.remove(
            "recording"
        );

        recordBtn.textContent =
            "🔴 Record";

        recordBtn.disabled = false;

        stopBtn.disabled = true;

        restartBtn.disabled =
            recordedEvents.length === 0;

        pauseBtn.disabled = true;

        clearBtn.disabled =
            recordedEvents.length === 0;

        playBtn.disabled =
            recordedEvents.length === 0;

        status.textContent =
            recordedEvents.length > 0
                ? "Play recorded — press Play to review it."
                : "No movement was recorded.";

    }


    /*
    ==========================================
    RECORD MOVEMENT
    ==========================================
    */

    function recordMovement(object) {

        if (!isRecording) {
            return;
        }

        const now =
            performance.now();

        const elapsed =
            (now - recordingStartTime) / 1000;

        /*
        Avoid creating hundreds of events
        while the pointer is moving.
        */

        if (
            elapsed - lastRecordedTime < 0.05
        ) {
            return;
        }

        lastRecordedTime = elapsed;

        const position =
            getPosition(object);

        recordedEvents.push({

            time: elapsed,

            object: getObjectName(object),

            x: position.x,

            y: position.y

        });

        addTimelineEvent(
            recordedEvents[
                recordedEvents.length - 1
            ]
        );

    }


    /*
    ==========================================
    FINAL POSITION
    ==========================================
    */

    function recordFinalMovement(object) {

        if (!isRecording) {
            return;
        }

        const elapsed =
            (performance.now() - recordingStartTime) / 1000;

        const position =
            getPosition(object);

        const event = {

            time: elapsed,

            object: getObjectName(object),

            x: position.x,

            y: position.y

        };

        recordedEvents.push(event);

        addTimelineEvent(event);

    }


    /*
    ==========================================
    TIMELINE
    ==========================================
    */

    function addTimelineEvent(event) {

        const empty =
            timeline.querySelector(
                ".timeline-empty"
            );

        if (empty) {
            empty.remove();
        }

        const item =
            document.createElement("div");

        item.className =
            "timeline-item";

        item.innerHTML = `
            <span class="timeline-time">
                ${event.time.toFixed(1)}s
            </span>

            <span class="timeline-player">
                ${event.object}
            </span>

            <span class="timeline-action">
                MOVE
            </span>
        `;

        timeline.appendChild(item);

        timeline.scrollTop =
            timeline.scrollHeight;

    }


    /*
    ==========================================
    DRAGGING
    ==========================================
    */

    function startDragging(event) {

        if (isPlaying) {
            return;
        }

        selectedObject =
            event.currentTarget;

        isDragging = true;

        selectedObject.classList.add(
            "selected"
        );

        selectedObject.setPointerCapture(
            event.pointerId
        );

        const objectName =
            getObjectName(selectedObject);

        status.textContent =
            isRecording
                ? "Recording " + objectName + " movement..."
                : "Moving " + objectName;

        event.preventDefault();

    }


    function moveObject(event) {

        if (
            !isDragging ||
            !selectedObject ||
            isPlaying
        ) {
            return;
        }

        const courtRect =
            court.getBoundingClientRect();

        let x =
            ((event.clientX - courtRect.left)
            / courtRect.width) * 100;

        let y =
            ((event.clientY - courtRect.top)
            / courtRect.height) * 100;

        x =
            Math.max(
                3,
                Math.min(97, x)
            );

        y =
            Math.max(
                5,
                Math.min(95, y)
            );

        selectedObject.style.left =
            x + "%";

        selectedObject.style.top =
            y + "%";

        recordMovement(
            selectedObject
        );

    }


    function stopDragging() {

        if (!selectedObject) {
            return;
        }

        if (isRecording) {

            recordFinalMovement(
                selectedObject
            );

        }

        isDragging = false;

        selectedObject.classList.remove(
            "selected"
        );

        status.textContent =
            isRecording
                ? "Movement recorded. Continue building the play."
                : "Position updated. Keep designing your play.";

        selectedObject = null;

    }


    /*
    ==========================================
    PLAYER EVENTS
    ==========================================
    */

    players.forEach(player => {

        player.addEventListener(
            "pointerdown",
            startDragging
        );

    });


    /*
    ==========================================
    BALL EVENT
    ==========================================
    */

    ball.addEventListener(
        "pointerdown",
        startDragging
    );


    /*
    ==========================================
    MOVEMENT
    ==========================================
    */

    court.addEventListener(
        "pointermove",
        moveObject
    );


    window.addEventListener(
        "pointerup",
        stopDragging
    );


    /*
    ==========================================
    PLAYBACK
    ==========================================
    */

    function startPlayback() {

        if (
            recordedEvents.length === 0 ||
            isRecording
        ) {
            return;
        }

        stopPlayback();

        restoreInitialPositions();

        isPlaying = true;

        isPaused = false;

        playbackPausedAt = 0;

        playbackStartTime =
            performance.now();

        playBtn.textContent =
            "▶ Playing...";

        playBtn.disabled = true;

        restartBtn.disabled = false;

        pauseBtn.disabled = false;

        pauseBtn.textContent =
            "⏸ Pause";

        status.textContent =
            "Playing your recorded play...";

        runPlayback();

    }


    function runPlayback() {

        if (!isPlaying) {
            return;
        }

        const elapsed =
            (
                performance.now()
                - playbackStartTime
            ) / 1000;

        const totalDuration =
            recordedEvents.length > 0
                ? recordedEvents[
                    recordedEvents.length - 1
                ].time
                : 0;

        let progress =
            totalDuration > 0
                ? (elapsed / totalDuration) * 100
                : 100;

        progress =
            Math.max(
                0,
                Math.min(100, progress)
            );

        playbackProgress.style.width =
            progress + "%";


        /*
        Apply every event whose time
        has arrived.
        */

        recordedEvents.forEach(event => {

            if (event.time <= elapsed) {

                const object =
                    findObject(
                        event.object
                    );

                if (!object) {
                    return;
                }

                object.style.left =
                    event.x + "%";

                object.style.top =
                    event.y + "%";

            }

        });


        if (
            elapsed >= totalDuration
        ) {

            finishPlayback();

            return;

        }


        playbackFrame =
            requestAnimationFrame(
                runPlayback
            );

    }


    /*
    ==========================================
    FIND OBJECT
    ==========================================
    */

    function findObject(name) {

        if (name === "Ball") {
            return ball;
        }

        const playerNumber =
            name.replace(
                "Player ",
                ""
            );

        return document.querySelector(
            `.player[data-player="${playerNumber}"]`
        );

    }


    /*
    ==========================================
    PAUSE
    ==========================================
    */

    function pausePlayback() {

        if (!isPlaying) {
            return;
        }

        if (!isPaused) {

            isPaused = true;

            playbackPausedAt =
                (
                    performance.now()
                    - playbackStartTime
                ) / 1000;

            cancelAnimationFrame(
                playbackFrame
            );

            pauseBtn.textContent =
                "▶ Resume";

            status.textContent =
                "Playback paused.";

        } else {

            isPaused = false;

            playbackStartTime =
                performance.now()
                - (
                    playbackPausedAt
                    * 1000
                );

            pauseBtn.textContent =
                "⏸ Pause";

            status.textContent =
                "Playback resumed.";

            runPlayback();

        }

    }


    /*
    ==========================================
    FINISH PLAYBACK
    ==========================================
    */

    function finishPlayback() {

        isPlaying = false;

        isPaused = false;

        cancelAnimationFrame(
            playbackFrame
        );

        playbackFrame = null;

        playbackProgress.style.width =
            "100%";

        playBtn.disabled = false;

        playBtn.textContent =
            "▶ Play";

        pauseBtn.disabled = true;

        pauseBtn.textContent =
            "⏸ Pause";

        restartBtn.disabled = false;

        status.textContent =
            "Playback finished. Press Play to watch it again.";

    }


    /*
    ==========================================
    STOP PLAYBACK
    ==========================================
    */

    function stopPlayback() {

        isPlaying = false;

        isPaused = false;

        cancelAnimationFrame(
            playbackFrame
        );

        playbackFrame = null;

        pauseBtn.disabled = true;

        pauseBtn.textContent =
            "⏸ Pause";

        if (recordedEvents.length > 0) {
            playBtn.disabled = false;
        }

    }


    /*
    ==========================================
    RESTART
    ==========================================
    */

    restartBtn.addEventListener(
        "click",
        () => {

            if (
                recordedEvents.length === 0
            ) {
                return;
            }

            stopPlayback();

            restoreInitialPositions();

            playbackProgress.style.width =
                "0%";

            status.textContent =
                "Play reset. Press Play to review it.";

        }
    );


    /*
    ==========================================
    PLAY
    ==========================================
    */

    playBtn.addEventListener(
        "click",
        startPlayback
    );


    /*
    ==========================================
    PAUSE
    ==========================================
    */

    pauseBtn.addEventListener(
        "click",
        pausePlayback
    );


    /*
    ==========================================
    RECORD BUTTON
    ==========================================
    */

    recordBtn.addEventListener(
        "click",
        startRecording
    );


    /*
    ==========================================
    STOP BUTTON
    ==========================================
    */

    stopBtn.addEventListener(
        "click",
        stopRecording
    );


    /*
    ==========================================
    CLEAR RECORDING
    ==========================================
    */

    clearBtn.addEventListener(
        "click",
        () => {

            stopPlayback();

            recordedEvents = [];

            initialPositions = {};

            recordingTime.textContent =
                "0.0s";

            playbackProgress.style.width =
                "0%";

            timeline.innerHTML = `
                <div class="timeline-empty">
                    No play recorded yet.
                    Press Record and start moving players.
                </div>
            `;

            playBtn.disabled = true;

            restartBtn.disabled = true;

            pauseBtn.disabled = true;

            clearBtn.disabled = true;

            status.textContent =
                "Recording cleared. You can design a new play.";

        }
    );


    /*
    ==========================================
    RESET
    ==========================================
    */

    resetBtn.addEventListener(
        "click",
        () => {

            location.reload();

        }
    );


    /*
    ==========================================
    INITIAL SETUP
    ==========================================
    */

    saveInitialPositions();

</script>

</body>
</html>
